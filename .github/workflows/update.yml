name: Update MX dashboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Russian Trusted CA (нужен для доступа к MOEX)
        run: |
          sudo mkdir -p /usr/local/share/ca-certificates/russian_trusted
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt | sudo tee /usr/local/share/ca-certificates/russian_trusted/russian_trusted_root_ca.crt > /dev/null
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt | sudo tee /usr/local/share/ca-certificates/russian_trusted/russian_trusted_sub_ca.crt > /dev/null
          sudo update-ca-certificates

      - name: Install dependencies
        run: pip install requests pandas truststore

      - name: Fetch data and rebuild dashboard
        env:
          MOEX_TOKEN: ${{ secrets.MOEX_TOKEN }}
        run: python scripts/update_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "mx-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/data.json data/futoi_MX_live.csv data/price_daily.json
          if git diff --cached --quiet; then
            echo "Нет изменений."
          else
            git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
